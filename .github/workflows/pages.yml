name: Refresh campaign snapshot and deploy

on:
  schedule:
    # Danish local times, expressed in UTC. These are CEST (UTC+2) offsets and will run an hour
    # later during CET (UTC+1, late Oct - late Mar). Edit when DST flips if the exact hour matters.
    #   08:00 Danish -> 06:00 UTC
    - cron: "0 6 * * *"
    #   17:00 Danish -> 15:00 UTC
    - cron: "0 15 * * *"
  push:
    branches:
      - main
      - claude/campaign-impact-benchmarker-o74r0o
    paths-ignore:
      # Don't loop on the bot's own snapshot commits.
      - "state/**"
      - "web/src/lib/seed.json"
      - "web/public/exports/**"
  workflow_dispatch:
    inputs:
      run_pipeline:
        description: "Poll watch rules and rebuild snapshots before deploying"
        required: false
        default: "true"
        type: boolean

permissions:
  contents: write   # commit the state DB + seed.json back to the branch
  pages: write
  id-token: write

concurrency:
  # Pushes are dashboard-only rebuilds and supersede each other. Scheduled and manual refreshes
  # serialize, and are never cancelled mid-pipeline — a cancelled run can leave the committed
  # state database and the snapshot describing different moments.
  group: ${{ github.event_name == 'push' && 'pages-deploy' || 'full-refresh' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  CIB_DB_PATH: state/cib.sqlite3
  # On push, skip the pipeline and just rebuild the site from the committed snapshot. Schedule and
  # manual dispatch run the full thing.
  RUN_PIPELINE: ${{ github.event_name == 'push' && 'false' || (github.event.inputs.run_pipeline || 'true') }}

jobs:
  refresh-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install
        run: pip install -e ".[api,ingest,watch,dev]"

      # ----- checks: a snapshot built from code that does not pass its own tests is not evidence
      - name: Lint
        run: ruff check backend/ scripts/

      - name: Docs are in sync with the metric definitions
        run: python scripts/render_metrics_doc.py --check

      - name: Test
        run: pytest backend/tests -p no:warnings

      # ----- pipeline -----
      - name: Poll watch rules
        if: env.RUN_PIPELINE == 'true'
        # Detects publication and alerts on a hit. Disabled rules are skipped, so this is a no-op
        # until real feeds are configured. `|| true` because an unreachable feed is recorded on
        # the rule, not a reason to fail the deploy.
        #
        # Notifications are ON here: a scheduled run is exactly when nobody is watching, so a hit
        # that only printed to this log would be a silent miss. With no secrets set the channel
        # falls back to stdout, which `cib doctor` reports as a warning rather than pretending it
        # is monitoring.
        env:
          CIB_NOTIFY_CHANNELS: ${{ vars.CIB_NOTIFY_CHANNELS || 'stdout' }}
          CIB_NOTIFY_WEBHOOK_URL: ${{ secrets.CIB_NOTIFY_WEBHOOK_URL }}
          CIB_SMTP_HOST: ${{ secrets.CIB_SMTP_HOST }}
          CIB_SMTP_PORT: ${{ vars.CIB_SMTP_PORT || '587' }}
          CIB_SMTP_USER: ${{ secrets.CIB_SMTP_USER }}
          CIB_SMTP_PASSWORD: ${{ secrets.CIB_SMTP_PASSWORD }}
          CIB_NOTIFY_EMAIL_FROM: ${{ secrets.CIB_NOTIFY_EMAIL_FROM }}
          CIB_NOTIFY_EMAIL_TO: ${{ secrets.CIB_NOTIFY_EMAIL_TO }}
        run: python -m cib.cli --as "github-actions" watch poll || true

      - name: Ingest coverage from automated sources
        if: env.RUN_PIPELINE == 'true'
        # Detection is not measurement: polling records that something published, this brings the
        # coverage in. Runs every enabled gdelt_query rule (no API key needed) and any feed rule
        # that opts in. Archive exports stay manual — they are licensed and cannot be fetched.
        env:
          MEDIACLOUD_API_KEY: ${{ secrets.MEDIACLOUD_API_KEY }}
        run: python -m cib.cli --as "github-actions" ingest --lookback-days 7 || true

      - name: Rebuild daily snapshots
        if: env.RUN_PIPELINE == 'true'
        run: python -m cib.cli snapshot --all

      - name: Show database stats
        if: env.RUN_PIPELINE == 'true'
        # Uses the project's own connection rather than the sqlite3 CLI, so the workflow depends
        # on nothing the runner image happens to ship.
        run: |
          echo "::group::Database"
          python -c "
          from cib.db import connect
          conn = connect()
          for table in ('campaigns','articles','outlets','escalations','mentions','watch_hits'):
              print(f'{table:14}', conn.execute(f'SELECT COUNT(*) FROM {table}').fetchone()[0])
          "
          echo "::endgroup::"

      - name: Setup check
        if: env.RUN_PIPELINE == 'true'
        # Informational, never fatal. Prints exactly what is still a placeholder so a run that
        # produced nothing says why, instead of looking healthy.
        run: python -m cib.cli doctor || true

      - name: Export dashboard snapshot
        run: python -m cib.cli --as "github-actions" export snapshot

      # ----- commit state back -----
      - name: Commit state and snapshot
        if: env.RUN_PIPELINE == 'true'
        run: |
          git config user.name  "cib-bot"
          git config user.email "cib-bot@users.noreply.github.com"
          git add state/cib.sqlite3 web/src/lib/seed.json web/public/exports
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "refresh: campaign snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin "HEAD:${GITHUB_REF#refs/heads/}"
          fi

      # ----- build the static site -----
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - run: npm run typecheck
        working-directory: web

      - name: Build static site
        run: npm run build
        working-directory: web
        env:
          NEXT_PUBLIC_DATA_MODE: static
          DEPLOY_BASE_PATH: /sentimenttracker

      # enablement: true switches the repository's Pages source to GitHub Actions if it is still
      # set to "Deploy from a branch". In branch mode GitHub runs its own Jekyll job over the repo
      # root and publishes README.md as the homepage, which is not this dashboard.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: refresh-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
